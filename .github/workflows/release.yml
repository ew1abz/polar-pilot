name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
          components: llvm-tools

      - name: Install cargo-binutils
        run: cargo install cargo-binutils

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Build firmware (release)
        run: cargo build --release

      - name: Produce .bin and .hex artifacts
        run: |
          cargo objcopy --release -- -O binary  polar-pilot-${{ github.ref_name }}.bin
          cargo objcopy --release -- -O ihex    polar-pilot-${{ github.ref_name }}.hex

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Polar Pilot ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            polar-pilot-${{ github.ref_name }}.bin
            polar-pilot-${{ github.ref_name }}.hex
