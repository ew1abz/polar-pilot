[package]
name = "w5500-rotator"
version = "0.1.0"
edition = "2021"

[dependencies]
# ── Embassy runtime ──────────────────────────────────────────────
# The executor runs your async tasks.  "platform-cortex-m" picks the
# right WFE/SEV wakeup, "executor-thread" gives you the #[main] macro.
embassy-executor = { version = "0.10", features = [
    "platform-cortex-m",
    "executor-thread",
] }

# ── Embassy HAL for STM32 ────────────────────────────────────────
# This is the *hardware abstraction layer*.  It wraps every peripheral
# (SPI, GPIO, DMA, RNG …) in async-friendly drivers.
#
# Key features:
#   "stm32l432kc"   — picks the right register map for our chip
#   "memory-x"      — auto-generates the linker script (flash/RAM layout)
#   "time-driver-tim2" — uses TIM2 as the time source for embassy-time
#   "exti"          — enables EXTI (external interrupt) support for GPIO
embassy-stm32 = { version = "0.6", features = [
    "stm32l432kc",
    "memory-x",
    "time-driver-tim2",
    "exti",
] }

# ── Timekeeping ──────────────────────────────────────────────────
embassy-time = { version = "0.5", features = [
    "tick-hz-32_768",
] }

# ── Networking ───────────────────────────────────────────────────
# embassy-net is a sans-std TCP/IP stack (wraps smoltcp internally).
# Minimal: TCP only, no DHCP, no ICMP — uses static IP.
embassy-net = { version = "0.9", features = [
    "tcp",
    "proto-ipv4",
    "medium-ethernet",
] }

# ── W5500 Ethernet driver ────────────────────────────────────────
# Bridges the W5500 hardware into embassy-net as a network Device.
embassy-net-wiznet = { version = "0.3" }

# ── SPI device wrapper ──────────────────────────────────────────
# The W5500 driver expects an `SpiDevice` (bus + chip-select combined).
# ExclusiveDevice wraps a raw SPI bus + CS pin into that trait.
embedded-hal-bus = { version = "0.3", features = ["async"] }

# ── Async I/O traits (Write::write_all, etc.) ───────────────────
embedded-io-async = "0.7"

# ── Panic handler — halt on panic (no defmt/RTT) ─────────────────
panic-halt = "1"

# ── Static allocation helper ─────────────────────────────────────
# Embassy tasks need 'static data.  StaticCell lets you safely
# initialize a static variable exactly once at runtime.
static_cell = "2"

# ── Heapless Vec (used by embassy-net StaticConfigV4) ──────────────
heapless = "0.9"

# ── Cortex-M runtime (vector table, reset handler) ──────────────
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"

[features]
test-spi = []   # Loop reading W5500 chip version register for hardware debugging

[profile.release]
debug = 2       # full debug info — probe-rs needs it for defmt
lto = "fat"
opt-level = "s" # optimize for size
